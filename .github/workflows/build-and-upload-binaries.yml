name: Build and Upload Release Artifacts

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
    # Any branch push that changes the release build checks it (no release).
    # Path filters do not apply to tag pushes.
    branches:
      - "**"
    paths:
      - "tasks.py"
      - ".github/workflows/build-and-upload-binaries.yml"
  workflow_dispatch:

jobs:
  # Each platform builds on its own runner: the binaries need cgo (CPU
  # inference with ONNX Runtime), and Go cannot cross-compile cgo without a
  # C cross-compiler.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            runs-on: macos-latest
          - target: linux
            runs-on: ubuntu-latest
          - target: windows
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install invoke
        run: |
          python -m pip install --upgrade pip
          pip install invoke

      - name: Create gaddag directory
        run: mkdir -p data/lexica/gaddag

      - name: Run build script
        run: inv build --target ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: macondo-${{ matrix.target }}
          path: macondo-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/macondo-*.zip
