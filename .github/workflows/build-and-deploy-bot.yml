name: Build and Deploy

on:
  push:
    branches:
      - "*"

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MACONDO_DATA_PATH: /opt/data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # America is the one word graph the tests need that isn't published
      # alongside the others, so it comes from the private repo; everything
      # else is fetched below. Publish America and this step, the checkout
      # above it, and the PAT all go away.
      - name: Clone lexicon repo
        uses: actions/checkout@v4
        with:
          repository: domino14/word-game-lexica
          path: word-game-lexica
          token: ${{ secrets.LEXICA_GH_PAT }}

      - run: cp -r data /opt/data
      # liwords doesn't publish America; the lexica repo's script builds it.
      - run: '"$GITHUB_WORKSPACE/word-game-lexica/build_kwgs.sh" /opt/data/lexica/gaddag America'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"

      # Fetched into their own directory so the cache holds exactly the
      # published files and nothing else. The fetch is a no-op on a cache hit,
      # and the key covers the file list, so editing that list refetches.
      - name: Cache lexicon data
        uses: actions/cache@v4
        with:
          path: lexica-cache/lexica/gaddag
          key: lexica-${{ hashFiles('cmd/fetch_lexica/lexica.txt') }}

      - name: Fetch lexicon data
        run: go run ./cmd/fetch_lexica -data-path lexica-cache

      - name: Install lexicon data
        run: cp lexica-cache/lexica/gaddag/* /opt/data/lexica/gaddag/

      # MAGPIE's static libraries, which every Go build links (see
      # scripts/build_magpie.sh). Word maps are built and saved on first use.
      - name: Build
        run: make

      - name: Run tests
        run: go test ./...

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: "Macondo backend built successfully for branch {{GITHUB_REF_NAME}}."

  # Releases cross-compile Windows (build-and-upload-binaries.yml); this keeps
  # that build working between tags. Compile only: no Windows runner here.
  windows_cross_compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"

      - name: Get llvm-mingw
        env:
          LLVM_MINGW_VERSION: "20261006"
          LLVM_MINGW: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.tar.xz" | sha256sum -c --strict -
          tar xJf "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Cross-compile bin/shell.exe
        run: make windows

  push_docker:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: domino14
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Tag Docker Image
        run: docker build -f Dockerfile-bot-prod -t ghcr.io/domino14/macondo-bot:${GITHUB_REF_NAME}-gh${GITHUB_RUN_NUMBER} .

      - name: Push Docker Image
        run: docker push ghcr.io/domino14/macondo-bot:${GITHUB_REF_NAME}-gh${GITHUB_RUN_NUMBER}

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: '[    {
            "fields": [
            { "name": "Repository", "value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})", "inline": true },
            { "name": "Branch", "value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/tree/${{github.ref_name}})", "inline": true },
            { "name": "Tag", "value": "ghcr.io/domino14/macondo-bot:${{github.ref_name}}-gh${{github.run_number}}"}
            ],
            "color":1127128
            }    ]'
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: ""
